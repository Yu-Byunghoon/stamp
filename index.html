<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>산도장 추천인 자동 연결</title>
  <script>
    window.onload = function() {
      // 추천인 코드가 포함된 산도장 가입 주소
      const targetUrl = "https://app.foreststamp.kr?ref=N7PW645V";

      // 1. 클립보드 복사 시도 (안전망)
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText("N7PW645V").catch(() => {});
      }

      // 2. 파라미터를 담아 산도장으로 바로 이동
      window.location.href = targetUrl;
    };
  </script>
</head>
<body>
  <p style="text-align: center; margin-top: 50px; font-family: sans-serif; font-size: 16px;">
    추천인 코드를 적용하여 마운트그램으로 이동 중입니다...
  </p>
</body>
</html>
